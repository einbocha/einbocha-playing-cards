# Releases a version tag (e.g. v1.2.3): verifies the tag, runs the full CI, publishes the crate to
# crates.io and creates the GitHub release.
name: cd

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  # A release is never cancelled midway; a second run for the same tag waits instead.
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      crate: ${{ steps.version.outputs.crate }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, to check that the tag is on main
      - name: Install the pixi environment
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.83.0
          cache-write: false
      - name: tag matches the crate version
        id: version
        run: |
          metadata="$(pixi run cargo metadata --no-deps --format-version 1)"
          crate="$(jq --exit-status --raw-output '.packages[0].name' <<<"$metadata")"
          version="$(jq --exit-status --raw-output '.packages[0].version' <<<"$metadata")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml."
            exit 1
          fi
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main."
            exit 1
          fi

  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: crates.io publish
    needs: [verify, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Protection rules for this environment (e.g. required reviewers) are set in the repository
    # settings.
    environment:
      name: crates-io
      url: https://crates.io/crates/${{ needs.verify.outputs.crate }}/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write # trusted publishing, exchanged for a short-lived crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This job holds the crates.io token, so it installs from pixi.lock instead of restoring a
      # cache that could have been tampered with.
      - name: Install the pixi environment
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.83.0
          cache: false
      - name: crates.io authentication
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: pixi run cargo publish --locked

  github-release:
    name: github release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # only to create the release
    steps:
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Versions with a pre-release part (e.g. v1.0.0-rc.1) are marked as pre-releases.
          prerelease=false
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=true; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease="$prerelease"
